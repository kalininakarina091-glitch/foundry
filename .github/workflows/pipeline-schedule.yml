name: Pipeline schedule
# Hourly pipeline step for the production site: sync the most overdue source
# or extract a couple of pending materials (see app/api/cron/pipeline).
# Runs on GitHub so it does not consume hosting credits and works on any host.
# This repository is public, so the log shows only status and counters.
on:
  schedule:
    # Minute 17 avoids the top-of-hour queue on GitHub's scheduler.
    - cron: "17 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: pipeline-schedule
  cancel-in-progress: false
jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run one pipeline step
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_ORIGIN" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_ORIGIN variable or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 90 \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_ORIGIN/api/cron/pipeline") || status=000
          summary=$(node -e '
            let r = {};
            try { r = JSON.parse(require("fs").readFileSync("response.json", "utf8")); } catch {}
            const res = r.result || {};
            console.log([
              "step=" + (r.step ?? "-"),
              "processed=" + (r.processed ?? "-"),
              "relevant=" + (r.relevant ?? "-"),
              "errors=" + (r.errors ?? "-"),
              "sync_ok=" + (res.ok ?? "-"),
              "imported=" + (res.imported ?? "-"),
            ].join(" "));
          ')
          echo "HTTP $status $summary"
          echo "HTTP $status · $summary" >> "$GITHUB_STEP_SUMMARY"
          rm -f response.json
          case "$status" in
            2??) ;;
            *) echo "::error::Pipeline step failed with HTTP $status"; exit 1 ;;
          esac
