name: Project checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foundry_ci
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: foundry_ci
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable CI service credentials; never production credentials.
      DATABASE_URL: postgresql://foundry_ci:disposable_ci_only@localhost:5432/foundry_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:setup
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: End-to-end checks (real HTTP + disposable Postgres, no AI)
        env:
          # Disposable CI-only secret; the server and the test share it.
          CRON_SECRET: ci-only-cron-secret-not-used-anywhere-else-000
          E2E_BASE_URL: http://localhost:3109
          E2E_ALLOW_MUTATIONS: "1"
          E2E_EXPECT_NO_AI: "1"
        run: |
          npx next start -p 3109 > next.log 2>&1 &
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:3109/login && break; sleep 1; done
          npm run e2e || { echo "--- server log"; tail -n 80 next.log; exit 1; }
